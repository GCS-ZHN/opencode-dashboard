<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opencode token usage</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-head">
      <div class="app-title">
        <h1>opencode token usage</h1>
        <span class="app-ver" id="app-ver"></span>
        <button class="mcp-box" id="mcp-box" type="button" title="Copy MCP endpoint URL">
          <span class="mcp-url" id="mcp-url"></span>
          <span class="mcp-copy">copy</span>
        </button>
      </div>
      <div class="legend">
        <span><i class="dot seg-in"></i>input</span>
        <span><i class="dot seg-out"></i>output</span>
        <span><i class="dot seg-rea"></i>reasoning</span>
        <span><i class="dot seg-cr"></i>cache read</span>
        <span><i class="dot seg-cw"></i>cache write</span>
      </div>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
