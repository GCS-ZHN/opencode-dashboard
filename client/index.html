<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opencode token usage</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-head">
      <div class="app-title">
        <h1>opencode token usage</h1>
        <button class="mcp-box" id="mcp-box" type="button" title="Copy MCP endpoint URL">
          <span class="mcp-url" id="mcp-url"></span>
          <span class="mcp-copy">copy</span>
        </button>
      </div>
      <div class="range-bar">
        <label for="range-select">Range</label>
        <select id="range-select" title="Restrict all levels to a date window">
          <option value="all" selected>All time</option>
          <option value="today">Today</option>
          <option value="7d">Last 7 days</option>
          <option value="custom">Custom…</option>
        </select>
        <div class="range-custom" id="range-custom" hidden>
          <input type="date" id="range-since" aria-label="from" />
          <span>→</span>
          <input type="date" id="range-until" aria-label="until" />
        </div>
      </div>
      <div class="legend">
        <span><i class="dot seg-in"></i>input</span>
        <span><i class="dot seg-out"></i>output</span>
        <span><i class="dot seg-rea"></i>reasoning</span>
        <span><i class="dot seg-cr"></i>cache read</span>
        <span><i class="dot seg-cw"></i>cache write</span>
      </div>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
